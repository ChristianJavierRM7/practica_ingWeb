version: '3.8'

services:
  # Base de datos PostgreSQL para la Tienda de Tecnología y Taller
  db:
    image: postgres:16-alpine
    container_name: postgres-techfix
    restart: always
    environment:
      POSTGRES_DB: techfix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_techfix_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  # Microservicio / Servidor API & Cliente Web (Node.js + Express)
  techfix-service:
    build: .
    container_name: techfix-api-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: techfix_db
      JWT_SECRET: super_secret_techfix_jwt_key_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      - db

volumes:
  postgres_techfix_data:
