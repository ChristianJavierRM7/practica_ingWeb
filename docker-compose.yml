version: '3.8'

services:
  # Base de datos PostgreSQL para la Tienda de Tecnología y Taller
  db:
    image: postgres:16-alpine
    container_name: postgres-techfix
    restart: always
    environment:
      POSTGRES_DB: techfix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_techfix_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  # Servidor REST API (Node.js + Express)
  techfix-service:
    build: ./backend
    container_name: techfix-api-service
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
    depends_on:
      - db

volumes:
  postgres_techfix_data:
